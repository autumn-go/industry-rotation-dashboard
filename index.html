<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>行业轮动指标监测 · ETF策略日频跟踪</title>
<style>
  :root {
    --r-lg: 22px; --r-md: 16px; --r-sm: 10px;
    --ease: cubic-bezier(.16,1,.3,1);
    --maxw: 1180px;
  }
  [data-theme="light"] {
    --bg:#eef1f8; --g1:#e8ecff; --g2:#fdeef6; --g3:#e6f7ff;
    --text:#0f172a; --muted:#5b6878; --faint:#93a0b0;
    --card:rgba(255,255,255,.62); --card-solid:#ffffff;
    --border:rgba(15,23,42,.08); --border-strong:rgba(15,23,42,.14);
    --shadow:0 18px 50px -20px rgba(30,41,80,.30);
    --accent:#6366f1; --accent2:#8b5cf6; --accent-soft:rgba(99,102,241,.12);
    --up:#dc2626; --down:#15a34a;
    --on:rgba(99,102,241,.16); --off:rgba(15,23,42,.05);
    --chip:rgba(99,102,241,.10); --chip-text:#4338ca;
    --grid:rgba(15,23,42,.05);
  }
  [data-theme="dark"] {
    --bg:#070b18; --g1:#1b1746; --g2:#0e1b33; --g3:#0a1430;
    --text:#e8edf7; --muted:#9aa7bd; --faint:#64748b;
    --card:rgba(255,255,255,.045); --card-solid:#0f1626;
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
    --shadow:0 22px 60px -24px rgba(0,0,0,.75);
    --accent:#818cf8; --accent2:#a78bfa; --accent-soft:rgba(129,140,248,.16);
    --up:#f87171; --down:#4ade80;
    --on:rgba(129,140,248,.20); --off:rgba(255,255,255,.05);
    --chip:rgba(129,140,248,.14); --chip-text:#c7d2fe;
    --grid:rgba(255,255,255,.05);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text); background:var(--bg);
    min-height:100vh; line-height:1.55; -webkit-font-smoothing:antialiased;
    transition:background .5s var(--ease), color .4s var(--ease);
  }
  body::before {
    content:""; position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(60vw 60vw at 12% 8%, var(--g1), transparent 60%),
      radial-gradient(55vw 55vw at 88% 18%, var(--g2), transparent 60%),
      radial-gradient(70vw 70vw at 50% 100%, var(--g3), transparent 65%);
    opacity:.9; transition:opacity .6s var(--ease);
  }
  body::after {
    content:""; position:fixed; inset:0; z-index:-1; opacity:.4;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 80%);
            mask-image:radial-gradient(circle at 50% 30%,#000,transparent 80%);
  }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 22px 80px; }

  /* ---------- top bar ---------- */
  .topbar {
    position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
    padding:16px 0; margin-bottom:8px;
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  }
  .brand { display:flex; align-items:center; gap:12px; margin-right:auto; }
  .logo {
    width:42px; height:42px; border-radius:13px; flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid; place-items:center; color:#fff; font-weight:800; font-size:20px;
    box-shadow:0 8px 24px -6px var(--accent);
  }
  .brand h1 { font-size:17px; font-weight:700; letter-spacing:.2px; }
  .brand p { font-size:12px; color:var(--muted); margin-top:1px; }

  .theme-toggle {
    display:flex; background:var(--off); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px;
  }
  .theme-toggle button {
    border:none; background:transparent; color:var(--muted); cursor:pointer; width:34px; height:30px;
    border-radius:999px; display:grid; place-items:center; transition:all .25s var(--ease);
  }
  .theme-toggle button.active { background:var(--card-solid); color:var(--accent); box-shadow:0 4px 12px -4px rgba(0,0,0,.25); }

  .btn {
    border:1px solid var(--border-strong); background:var(--card-solid); color:var(--text);
    padding:9px 16px; border-radius:12px; font-size:13.5px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; transition:transform .2s var(--ease), box-shadow .25s var(--ease), background .25s;
  }
  .btn:hover { box-shadow:0 10px 26px -10px rgba(0,0,0,.4); }
  .btn-primary {
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none;
    box-shadow:0 12px 30px -10px var(--accent);
  }
  .btn[disabled] { opacity:.6; cursor:progress; }
  .btn .spin { width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---------- hero / regime ---------- */
  .hero {
    border:1px solid var(--border); background:var(--card); backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%); border-radius:var(--r-lg);
    padding:26px 28px; margin:14px 0 22px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .hero::before {
    content:""; position:absolute; right:-60px; top:-60px; width:240px; height:240px; border-radius:50%;
    background:radial-gradient(circle,var(--accent-soft),transparent 70%); pointer-events:none;
  }
  .hero-top { display:flex; flex-wrap:wrap; align-items:flex-end; gap:18px; justify-content:space-between; }
  .regime-chip {
    display:inline-flex; align-items:center; gap:9px; padding:8px 16px; border-radius:999px;
    background:var(--chip); color:var(--chip-text); font-weight:700; font-size:15px; border:1px solid var(--border);
  }
  .regime-chip .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .hero-meta { font-size:12.5px; color:var(--muted); text-align:right; }
  .hero-meta b { color:var(--text); }
  .hero-stats { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  .stat-pill {
    background:var(--off); border:1px solid var(--border); border-radius:14px; padding:12px 16px; min-width:120px;
  }
  .stat-pill .k { font-size:11.5px; color:var(--muted); }
  .stat-pill .v { font-size:22px; font-weight:800; margin-top:2px; letter-spacing:.5px; }

  /* ---------- sections ---------- */
  section.block { margin:30px 0; }
  .sec-head { display:flex; align-items:baseline; gap:12px; margin:0 4px 16px; }
  .sec-head h2 { font-size:20px; font-weight:750; letter-spacing:.3px; }
  .sec-head .bar { width:5px; height:22px; border-radius:3px; background:linear-gradient(var(--accent),var(--accent2)); }
  .sec-head .hint { font-size:12.5px; color:var(--muted); margin-left:auto; }

  .grid { display:grid; gap:14px; }
  .metrics { grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); }
  .card {
    border:1px solid var(--border); background:var(--card); backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%); border-radius:var(--r-md);
    padding:16px 17px; box-shadow:var(--shadow); transition:transform .3s var(--ease), border-color .3s;
  }
  .card:hover { transform:translateY(-3px); border-color:var(--border-strong); }
  .metric .k { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .metric .v { font-size:25px; font-weight:800; margin-top:6px; letter-spacing:.4px; }
  .metric .s { font-size:11.5px; color:var(--faint); margin-top:3px; }

  .pos { color:var(--up); }
  .neg { color:var(--down); }
  .arrow { font-size:.78em; margin-right:2px; }

  /* ---------- signal board ---------- */
  .cats { grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); }
  .cat {
    border:1px solid var(--border); background:var(--card); backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%); border-radius:var(--r-md); padding:16px 16px 8px;
    box-shadow:var(--shadow); transition:transform .3s var(--ease);
  }
  .cat:hover { transform:translateY(-3px); }
  .cat-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .cat-head .name { font-weight:700; font-size:15px; }
  .cat-head .cnt {
    margin-left:auto; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--off); color:var(--muted);
  }
  .cat-head .cnt.on { background:var(--on); color:var(--chip-text); }
  .sig {
    display:grid; grid-template-columns:auto 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--border);
    align-items:start;
  }
  .sig .st { width:11px; height:11px; border-radius:50%; margin-top:5px; background:var(--off); border:1px solid var(--border-strong); }
  .sig.on .st { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .sig .body { min-width:0; }
  .sig .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sig .nm { font-size:13.5px; font-weight:650; }
  .sig.on .nm { color:var(--accent); }
  .dir { font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; }
  .dir.strong { background:rgba(34,160,74,.14); color:#179a44; }
  .dir.weak { background:rgba(220,38,38,.13); color:#d4302a; }
  [data-theme="dark"] .dir.strong { background:rgba(74,222,128,.16); color:#4ade80; }
  [data-theme="dark"] .dir.weak { background:rgba(248,113,113,.16); color:#f87171; }
  .sig .note { font-size:11.8px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .sig .stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:10.8px; color:var(--faint); }
  .sig .stats span b { color:var(--muted); font-weight:600; }

  /* ---------- top5 ---------- */
  .top5 { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .pick {
    border:1px solid var(--border); background:var(--card); backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%); border-radius:var(--r-md); padding:18px 18px 16px;
    box-shadow:var(--shadow); position:relative; overflow:hidden; transition:transform .35s var(--ease), box-shadow .35s;
  }
  .pick:hover { transform:translateY(-5px) scale(1.015); box-shadow:0 26px 60px -22px var(--accent); }
  .pick .rank {
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
    font-weight:800; font-size:14px; background:var(--accent-soft); color:var(--accent);
  }
  .pick .ind { font-size:18px; font-weight:800; letter-spacing:.5px; }
  .pick .etf { font-size:12px; color:var(--muted); margin-top:4px; }
  .pick .etf b { color:var(--text); font-weight:600; }
  .pick .etf .etf-code { font-variant-numeric:tabular-nums; letter-spacing:.3px; color:var(--faint); }
  .pick .no-etf { color:var(--warn,#c08a2a); font-weight:600; line-height:1.5; }
  .pick .no-etf .muted { color:var(--faint); font-weight:500; font-size:11px; }
  .pick-noetf { border-color:rgba(192,138,42,.35); }
  .pick .tag-muted { font-size:11px; font-weight:600; color:var(--faint); background:rgba(127,127,127,.12); padding:4px 9px; border-radius:999px; }
  .pick .ret { font-size:15px; font-weight:700; margin-top:12px; }
  .pick .score-row { margin-top:12px; }
  .pick .score-row .lab { font-size:10.5px; color:var(--faint); display:flex; justify-content:space-between; }
  .pick .bar-bg { height:7px; border-radius:99px; background:var(--off); margin-top:5px; overflow:hidden; }
  .pick .bar-fg { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0; transition:width 1s var(--ease); }
  .buy-tag {
    display:inline-flex; align-items:center; gap:5px; margin-top:13px; font-size:11px; font-weight:700;
    color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); padding:4px 10px; border-radius:99px;
  }
  .empty {
    grid-column:1/-1; text-align:center; padding:40px; color:var(--muted); border:1px dashed var(--border); border-radius:var(--r-md);
  }

  /* ---------- history ---------- */
  .timeline { border:1px solid var(--border); background:var(--card); backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%); border-radius:var(--r-lg); padding:8px 22px; box-shadow:var(--shadow); }
  .tl-item { display:grid; grid-template-columns:120px 1fr; gap:16px; padding:16px 0; border-top:1px solid var(--border); align-items:center; }
  .tl-item:first-child { border-top:none; }
  .tl-date { font-weight:700; font-size:14px; }
  .tl-date small { display:block; color:var(--faint); font-weight:500; font-size:11px; }
  .tl-body { min-width:0; }
  .tl-regime { display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--chip); color:var(--chip-text); margin-bottom:6px; }
  .tl-top5 { font-size:12px; color:var(--muted); }
  .tl-top5 b { color:var(--text); font-weight:600; }

  /* ---------- decon ---------- */
  .decon { border:1px solid var(--border); background:var(--card); backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%); border-radius:var(--r-lg); padding:24px 26px; box-shadow:var(--shadow); }
  .decon h3 { font-size:15px; margin:18px 0 8px; }
  .decon h3:first-child { margin-top:0; }
  .decon p, .decon li { font-size:13px; color:var(--muted); line-height:1.7; }
  .decon ul { padding-left:20px; margin:6px 0; }
  .decon .kbox { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .decon .kpi { font-size:11.5px; padding:5px 11px; border-radius:10px; background:var(--off); border:1px solid var(--border); color:var(--text); }
  .decon code { background:var(--off); padding:1px 6px; border-radius:6px; font-size:12px; color:var(--accent); }
  .disclaim { margin-top:22px; font-size:11.5px; color:var(--faint); border-top:1px solid var(--border); padding-top:14px; line-height:1.6; }

  /* ---------- toast ---------- */
  .toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--card-solid); color:var(--text); border:1px solid var(--border-strong); padding:12px 20px;
    border-radius:13px; box-shadow:var(--shadow); font-size:13px; font-weight:600; z-index:100; transition:all .4s var(--ease); pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* reveal */
  .reveal { opacity:0; transform:translateY(18px); animation:fadeUp .7s var(--ease) forwards; }
  @keyframes fadeUp { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { .reveal { animation:none; opacity:1; transform:none; } }

  footer { text-align:center; color:var(--faint); font-size:12px; margin-top:40px; }
  .legend { display:inline-flex; gap:14px; font-size:11.5px; color:var(--muted); margin-top:6px; }
  .legend span i { font-style:normal; font-weight:800; }
  /* ---------- detail modal ---------- */
  .modal-overlay { position:fixed; inset:0; background:rgba(8,12,22,.55); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:24px; z-index:60; opacity:0; pointer-events:none; transition:opacity .22s ease; }
  .modal-overlay.show { opacity:1; pointer-events:auto; }
  .modal { width:min(680px,100%); max-height:84vh; overflow:auto; background:var(--card-solid); border:1px solid var(--border-strong); border-radius:20px; box-shadow:0 30px 80px -20px rgba(0,0,0,.5); transform:translateY(14px) scale(.98); transition:transform .24s cubic-bezier(.16,1,.3,1); }
  .modal-overlay.show .modal { transform:none; }
  .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 22px 13px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card-solid); z-index:1; }
  .modal-head h3 { margin:0; font-size:17px; }
  .modal-head .sub { margin-top:4px; font-size:12.5px; color:var(--muted); }
  .modal-close { border:none; background:var(--card); color:var(--muted); width:32px; height:32px; border-radius:10px; font-size:20px; line-height:1; cursor:pointer; flex:none; transition:.2s; }
  .modal-close:hover { background:var(--border); color:var(--text); }
  .modal-body { padding:14px 22px 22px; }
  .dtl-summary { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .dtl-chip { font-size:12px; padding:5px 11px; border-radius:99px; background:var(--card); border:1px solid var(--border); color:var(--muted); }
  .dtl-chip b { color:var(--text); font-weight:700; }
  .dtl-list { display:flex; flex-direction:column; gap:5px; }
  .dtl-row { display:grid; grid-template-columns:26px 1fr 86px; align-items:center; gap:10px; padding:7px 10px; border-radius:11px; background:var(--card); transition:.15s; }
  .dtl-row:hover { box-shadow:0 0 0 1px var(--border-strong) inset; }
  .dtl-row .rk { font-size:12px; color:var(--muted); text-align:center; }
  .dtl-row .nm { font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .dtl-row .nm .tag5 { font-size:10px; font-weight:700; color:#fff; background:var(--accent); padding:1px 6px; border-radius:6px; }
  .dtl-row .rt { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; font-size:13.5px; }
  .dtl-bar { grid-column:1 / -1; height:4px; border-radius:99px; background:rgba(127,127,127,.18); overflow:hidden; margin-top:3px; }
  .dtl-bar > i { display:block; height:100%; border-radius:99px; }
  .dtl-median { height:0; border-top:1px dashed var(--accent); margin:7px 2px; position:relative; }
  .dtl-median span { position:absolute; right:0; top:-9px; font-size:10px; color:var(--accent); background:var(--card-solid); padding:0 6px; font-weight:600; }
  .dtl-empty { color:var(--muted); font-size:13px; padding:10px 4px; }
  /* clickable metric cards / hero pill */
  .card.metric.clickable, .stat-pill.clickable { cursor:pointer; position:relative; }
  .card.metric.clickable:hover { border-color:var(--accent); box-shadow:0 10px 30px -12px var(--accent-soft); }
  .card.metric.clickable:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .stat-pill.clickable { transition:.2s; }
  .stat-pill.clickable:hover { background:var(--accent-soft); }
  .detail-badge { position:absolute; top:10px; right:10px; font-size:10.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:7px; opacity:.6; transition:.2s; }
  .card.metric.clickable:hover .detail-badge { opacity:1; }
  /* signal detail modal */
  .sig.clickable { cursor:pointer; position:relative; margin:0 -8px; padding:10px 8px; border-radius:12px; transition:.18s; }
  .sig.clickable:hover { background:var(--accent-soft); }
  .sig.clickable:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .sig .detail-badge { position:absolute; top:9px; right:10px; font-size:10px; font-weight:700; color:var(--accent); background:var(--card-solid); border:1px solid var(--border); padding:1px 7px; border-radius:7px; opacity:0; transition:.18s; }
  .sig.clickable:hover .detail-badge, .sig.clickable:focus-visible .detail-badge { opacity:1; }
  .sig-sec { margin-top:18px; }
  .sig-sec h4 { font-size:12.5px; font-weight:700; margin:0 0 7px; color:var(--text); display:flex; align-items:center; gap:7px; }
  .sig-sec h4::before { content:''; width:3px; height:13px; border-radius:2px; background:var(--accent); }
  .sig-sec p { font-size:13px; color:var(--muted); line-height:1.7; margin:0; }
  .sig-dir-note b { color:var(--text); }
  .layer-note { margin-top:10px; padding:10px 12px; border-radius:12px; font-size:11.5px; line-height:1.75; color:var(--faint); background:var(--glass); border:1px solid var(--border); }
  .layer-note b { color:var(--text); font-weight:600; }
  .sig-stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:9px; }
  .sig-stat { border:1px solid var(--border); border-radius:12px; padding:9px 11px; background:var(--card); }
  .sig-stat .k { font-size:10.5px; color:var(--muted); }
  .sig-stat .v { font-size:16px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
  .sig-stat.big .v { color:var(--accent); }
  /* ---------- sandbox threshold panel ---------- */
  .sandbox-panel { margin:14px 0 6px; border:1px solid var(--border); border-radius:18px; background:var(--glass); backdrop-filter:blur(14px); overflow:hidden; }
  .sb-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 16px; cursor:pointer; user-select:none; }

      <div class="legend"><span><i class="pos">▲</i> 红涨</span><span><i class="neg">▼</i> 绿跌</span><span>仅为策略信号跟踪，非投资建议</span></div>

<script>
// ---------------- theme ----------------
const THEME_KEY = 'rot-theme';
const themeBtns = document.querySelectorAll('#themeToggle button');
function resolveSystem(){ return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function paint(t){ document.documentElement.setAttribute('data-theme', t === 'system' ? resolveSystem() : t); }
let theme = localStorage.getItem(THEME_KEY) || 'system';
function syncThemeUI(){ themeBtns.forEach(b => b.classList.toggle('active', b.dataset.t === theme)); }
paint(theme); syncThemeUI();
themeBtns.forEach(b => b.addEventListener('click', () => { theme = b.dataset.t; localStorage.setItem(THEME_KEY, theme); paint(theme); syncThemeUI(); }));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'system') paint('system'); });

// ---------------- helpers ----------------
const $ = s => document.querySelector(s);
function fmtPct(v, d = 2){ if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return '—'; return (v >= 0 ? '+' : '') + v.toFixed(d) + '%'; }
function sg(v){ if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return ''; return v >= 0 ? 'pos' : 'neg'; }
function ar(v){ if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return ''; return v >= 0 ? '▲' : '▼'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function pStr(p){ if (p === null || p === undefined) return '—'; const n = +p; if (n <= 0) return '<0.0001'; return n.toFixed(4); }

// ---------------- data ----------------
let LATEST = null, HISTORY = [], SIG_LOOKUP = {};

// 各信号的量化定义（Plain-language，便于在详情弹层解释「这个信号到底看什么指标」）
const SIG_DESC = {
  s1: '研报定义「低开—下探—盘中拉回」的日内形态，本页用三个日内指标的滚动60日分布分位精确刻画：①低开 = 当日开盘收益 openGap 处于历史 20% 分位以下；②下探 = 盘中最低价相对开盘价的回落 dip 处于历史 25% 分位以下；③拉回 = 收盘价在当日振幅区间的位置 recovery 处于历史 70% 分位以上。前提：沪深300 收盘价低于 20 日均线（pos20<0）。确认：当日收涨或上涨广度分位 > 50%。四项同时满足才激活。',
  s2: '精确触发条件：沪深300 收盘价低于 20 日均线（pos20<0）且 上涨行业占比 upRatio 处于滚动60日分布的历史 60% 分位以上 且 30 个中信一级行业当日收益中位数 medianRet > 0。',
  s3: '精确触发条件：沪深300、中证500、中证1000 当日收益率均 > 0（当日同涨）且 上涨行业占比 upRatio 处于滚动60日分布的历史 50% 分位以上（高于历史中位）。',
  s4: '精确触发条件：沪深300 收盘价低于 20 日均线（pos20<0）且 20 日累计收益率 > 0 且 20 日波动率 vol（日收益率滚动标准差）处于滚动60日分布的历史 50% 分位以下（振幅较前期收敛）。研报原信号基于波动率/振幅收敛，非量能。',
  s5: '精确触发条件：小盘-大盘相对强弱 smallVsLarge（中证1000收益−沪深300收益，20日）的 z 分数 < −1.0（低于其60日均值1个标准差）且 当日小盘相对大盘收益差 > 0 且 沪深300 当日收涨。',
  s6: '精确触发条件：中证全指当日收益率处于滚动60日分布的历史 10% 分位以下（单日跌幅位于历史最低10%区间）。买入方向例外：s6 为反向(市场弱势)信号，但买入标的取「相对抗跌(跌幅最小、相对强势)」行业，与 s5/s10/s11/s12/s13 的「买超跌」不同。',
  s7: '精确触发条件：smallVsLarge 的 z 分数 < −1.0 且 当日小盘相对大盘收益差 > 0 且 上涨广度分位 > 50%。',
  s8: '精确触发条件：smallVsLarge 的 z 分数 > 1.0 且 当日小盘相对大盘收益差 > 0 且 上涨广度分位 > 50%。',
  s9: '精确触发条件：成长-沪深300相对强弱 growthVsBroad（创业板指收益−沪深300收益，20日）的 z 分数 < −1.0 且 当日成长相对沪深300收益差 > 0。',
  s10: '精确触发条件：growthVsBroad 的 z 分数 < −1.5 且 沪深300 当日收涨。',
  s11: '精确触发条件：中证全指当日收益率处于历史 15% 分位以下 且 上涨行业占比分位 < 25%（历史最低25%区间，广度极低）。',
  s12: '精确触发条件：沪深300、中证500、中证1000 当日收益率均 < 0（同步下跌）且 中证全指当日收益率处于历史 30% 分位以下（跌幅较高）。研报原信号为「当日多宽基同步下跌」。',
  s13: '精确触发条件：中证全指当日收益率处于历史 10% 分位以下 且 量能 volExpand（中证全指成交额/20日均额）处于历史 80% 分位以上（放量）。',
  s14: '精确触发条件：行业收益离散度 dispersion（30行业日收益标准差）或 强弱差 topMinusBottom（最强−最弱行业收益差）处于滚动60日分布的历史 80% 分位以上（结构性分化扩大）。',
};

async function getJSON(u){
  try {
    const r = await fetch(u);
    if (!r.ok) { console.error('请求失败', u, r.status, r.statusText); return null; }
    return await r.json();
  } catch (e) { console.error('请求异常', u, e); return null; }
}

async function refresh(){
  const btn = $('#refreshBtn'), icon = $('#refreshIcon'), txt = $('#refreshTxt');
  btn.disabled = true; icon.outerHTML = '<span class="spin" id="refreshIcon"></span>'; txt.textContent = '刷新中…';
  const prev = LATEST ? LATEST.generatedAt : null;
  await fetch('/api/refresh', { method: 'POST' });
  const started = Date.now();
  const iv = setInterval(async () => {
    const d = await getJSON('/api/data');
    if (d && d.generatedAt !== prev){ clearInterval(iv); render(d); initSandbox(LATEST.params); finishRefresh(); toast('✓ 数据已更新（' + d.date + '）'); }
    else if (Date.now() - started > 300000){ clearInterval(iv); finishRefresh(); toast('⚠ 刷新超时，请稍后重试'); }
  }, 2500);
}
function finishRefresh(){
  const btn = $('#refreshBtn'), txt = $('#refreshTxt');
  $('#refreshIcon')?.remove();
  const ic = document.createElement('span'); ic.id = 'refreshIcon'; ic.textContent = '⟳'; btn.prepend(ic);
  txt.textContent = '刷新数据'; btn.disabled = false;
}
$('#refreshBtn').addEventListener('click', refresh);

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3200);
}

// ---------------- render ----------------
function render(d){
  LATEST = d;
  const m = d.market || {}, b = d.breadth || {}, sig = d.signals || {};
  const hasPos = d.hasPosition;

  const meta = `
    <div class="hero reveal">
      <div class="hero-top">
        <div>
          <span class="regime-chip"><span class="dot"></span>${esc(d.regime || '—')}</span>${d.sandbox ? '<span class="sandbox-badge">沙盘推演（切点已改）</span>' : ''}
          <div style="margin-top:12px;font-size:12.5px;color:var(--muted)">基于 ${d.activeCount || 0}/14 个市场状态信号 · ${d.activeCats || 0}/6 大类 当前激活</div>
        </div>
        <div class="hero-meta">
          事件日（截面）：<b>${esc(m.snapDate || '—')}</b><br/>
          趋势背景（时序）：<b>${esc(m.trendDate || '—')}</b><br/>
          生成于：${esc((d.generatedAt || '').replace('T',' ').slice(0,19))}<br/>
          数据源：${esc(d.dataSource || '—')}
        </div>
      </div>
      <div class="hero-stats">
        <div class="stat-pill"><div class="k">${esc(m.indexName || '宽基')} 当日</div><div class="v ${sg(m.indexPct)}">${ar(m.indexPct)}${fmtPct(m.indexPct)}</div></div>
        <div class="stat-pill"><div class="k">激活信号</div><div class="v">${d.activeCount || 0}<span style="font-size:14px;color:var(--muted)">/14</span></div></div>
        <div class="stat-pill"><div class="k">激活大类</div><div class="v">${d.activeCats || 0}<span style="font-size:14px;color:var(--muted)">/6</span></div></div>
        <div class="stat-pill clickable" data-detail="breadth" role="button" tabindex="0"><div class="k">上涨行业</div><div class="v">${b.upCount || 0}<span style="font-size:14px;color:var(--muted)">/${b.total || 30}</span></div></div>
        <div class="stat-pill"><div class="k">当前持仓</div><div class="v" style="font-size:18px">${hasPos ? '多头' : '空仓'}</div></div>
      </div>
    </div>`;

  const metrics = [
    { k:'相对20日均线', v:fmtPct(m.pos20), c:sg(m.pos20), s:(m.trendBelowMA20?'位于下方':'位于上方') },
    { k:'相对60日均线', v:fmtPct(m.pos60), c:sg(m.pos60), s:(m.trendBelowMA60?'位于下方':'位于上方') },
    { k:'20日收益(沪深300)', v:fmtPct(m.trendRet20), c:sg(m.trendRet20), s:'趋势背景' },
    { k:'小盘-大盘(20日)', v:fmtPct(m.smallVsLarge), c:sg(m.smallVsLarge), s:'风格：小盘相对' },
    { k:'成长-沪深300(20日)', v:fmtPct(m.growthVsBroad), c:sg(m.growthVsBroad), s:'风格：成长相对' },
    { k:'量能放大', v:(m.volExpand==null?'—':(m.volExpand>=1?m.volExpand.toFixed(2)+'x':'萎缩')), c:(m.volExpand==null?'':(m.volExpand>=1.4?'neg':(m.volExpand<0.8?'pos':''))), s:'全指额/20日均' },
    { k:'沪深300 日内形态', v:(m.openGap!=null?fmtPct(m.openGap):'—'), c:(m.openGap==null?'':sg(m.openGap)), s:`低开 ${m.openGap!=null?m.openGap.toFixed(2):'—'}% · 下探 ${m.dip!=null?m.dip.toFixed(2):'—'}% · 收回 ${m.recovery!=null?(m.recovery*100).toFixed(0):'—'}%`, detail:'intraday' },
    { k:'上涨行业占比', v:(b.upRatio!=null?(b.upRatio*100).toFixed(0)+'%':'—'), c:'', s:(b.upCount||0)+' / '+(b.total||30)+' 行业', detail:'breadth' },
    { k:'行业收益中位数', v:fmtPct(b.medianRet), c:sg(b.medianRet), s:'中信一级', detail:'median' },
    { k:'行业离散度', v:(b.dispersion!=null?b.dispersion.toFixed(2)+'%':'—'), c:'', s:'收益标准差', detail:'dispersion' },
    { k:'最强-最弱差', v:(b.topMinusBottom!=null?b.topMinusBottom.toFixed(2)+'%':'—'), c:'', s:(b.maxRet!=null?fmtPct(b.maxRet):'—')+' ~ '+(b.minRet!=null?fmtPct(b.minRet):'—'), detail:'spread' },
    { k:'创业板指当日', v:fmtPct(m.cybPct), c:sg(m.cybPct), s:'风格参考' },
    { k:'中证1000当日', v:fmtPct(m.z1Pct), c:sg(m.z1Pct), s:'小盘参考' },
  ];
  const market = `<section class="block reveal"><div class="sec-head"><span class="bar"></span><h2>市场环境仪表盘</h2><span class="hint">宽基指数 · 均线位置 · 风格/量能/广度</span></div>
    <div class="grid metrics">${metrics.map(x => `<div class="card metric ${x.detail?'clickable':''}" ${x.detail?`data-detail="${x.detail}" role="button" tabindex="0"`:''}><div class="k">${esc(x.k)}</div><div class="v ${x.c}">${ar(x.v)}${esc(x.v)}</div><div class="s">${esc(x.s)}</div>${x.detail?'<span class="detail-badge">⇲ 明细</span>':''}</div>`).join('')}</div></section>`;

  const cats = (d.categories || []).map(c => {
    const sigs = c.signals.map(s => {
      const st = s.stats || {};
      return `<div class="sig ${s.active ? 'on' : ''} clickable" data-sig="${s.id}" role="button" tabindex="0">
        <div class="st"></div>
        <div class="body">
          <div class="row1"><span class="nm">${esc(s.name)}</span><span class="dir ${s.dir}">${s.dir === 'strong' ? '正向' : '反向'}·配${s.buy === 'strong' ? '强势' : '弱势'}</span></div>
          <div class="note">${esc(s.note || '')}</div>
          <div class="stats"><span>胜率 <b>${st.absWin != null ? st.absWin + '%' : '—'}</b></span><span>显著度 p=<b>${pStr(st.p)}</b></span><span>触发率 <b>${st.trig != null ? st.trig + '%' : '—'}</b></span></div>
        </div>
        <span class="detail-badge">说明</span>
      </div>`;
    }).join('');
    return `<div class="cat"><div class="cat-head"><span class="name">${esc(c.name)}</span><span class="cnt ${c.active ? 'on' : ''}">${c.active}/${(c.signals||[]).length} 激活</span></div>${sigs}</div>`;
  }).join('');
  // 构建信号查找表（id -> {信号数据, 大类名}），供详情弹层使用
  SIG_LOOKUP = {};
  (d.categories || []).forEach(c => (c.signals || []).forEach(s => { SIG_LOOKUP[s.id] = { ...s, catName: c.name }; }));
  const board = `<section class="block reveal"><div class="sec-head"><span class="bar"></span><h2>六类 · 十五信号监控板</h2><span class="hint">行情精确 · 信号按滚动60日分布的可复现统计规则触发</span></div>
    <div class="grid cats">${cats}</div></section>`;

  const top5 = (d.top5 || []);
  const picks = top5.length ? top5.map((t, i) => {
    const hasEtf = !!(t.etf && t.etf.code);
    const etfCell = hasEtf
      ? `<span style="font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.5px">代表ETF</span><br/><b>${esc(t.etf.name)}</b><br/><span class="etf-code">${esc(t.etf.code)}</span>`
      : `<span class="no-etf">该行业暂无单行业 ETF<br/><span class="muted">仅作行业信号，不生成买入指令</span></span>`;
    const tag = hasEtf
      ? `<span class="buy-tag">● ETF 买入信号</span>`
      : `<span class="tag-muted">仅行业轮动信号</span>`;
    return `
    <div class="pick ${hasEtf ? '' : 'pick-noetf'}">
      <div class="rank">${i + 1}</div>
      <div class="ind">${esc(t.name)}</div>
      <div class="etf">${etfCell}</div>
      <div class="ret ${sg(t.ret)}">${ar(t.ret)}${fmtPct(t.ret)} <span style="font-size:11px;color:var(--faint);font-weight:500">中信一级当日</span></div>
      <div class="score-row">
        <div class="lab"><span>融合得分</span><span>${ (t.score||0).toFixed(2) }</span></div>
        <div class="bar-bg"><div class="bar-fg" data-w="${Math.round((t.signalStrength||0)*100)}"></div></div>
      </div>
      ${tag}
    </div>`;
  }).join('')
    : `<div class="empty">当前无激活的市场状态信号，策略建议<b style="color:var(--text)"> 空仓观察</b>。市场环境未触发任何轮动条件。</div>`;
  const top5sec = `<section class="block reveal"><div class="sec-head"><span class="bar"></span><h2>Top 5 行业多头组合 · ETF 买入信号</h2><span class="hint">${hasPos ? '类内等权→类间等权→20日衰减叠加' : '无持仓'}</span></div>
    <div class="grid top5">${picks}</div></section>`;

  const hist = (HISTORY || []).slice().reverse();
  const tl = hist.length ? hist.map((h, i) => `
    <div class="tl-item">
      <div class="tl-date">${esc(h.date || '—')}${i === 0 ? '<small>最新</small>' : ''}</div>
      <div class="tl-body">
        <span class="tl-regime">${esc(h.regime || '—')}</span>
        <div class="tl-top5">组合：<b>${(h.top5 || []).map(t => t.name).join(' · ') || '—'}</b></div>
      </div>
    </div>`).join('')
    : `<div class="empty">暂无历史记录，刷新后会逐日累积。</div>`;
  const histSec = `<section class="block reveal"><div class="sec-head"><span class="bar"></span><h2>日频刷新历史</h2><span class="hint">每日收盘后触发，累积市场状态与组合</span></div>
    <div class="timeline">${tl}</div></section>`;

  const decon = `<section class="block reveal"><div class="sec-head"><span class="bar"></span><h2>指标拆解 · 数据与信号说明</h2><span class="hint">策略框架与可解释实现</span></div>
    <div class="decon">
      <h3>一、策略逻辑（国泰海通证券 ETF配置系列八）</h3>
      <p>该策略将市场状态拆解为 <b>6 大类、15 个信号</b>。每个信号在历史上被验证为某类行业后续表现占优的标志：<b>正向信号</b>指向买入前期强势行业，<b>反向信号</b>指向买入前期弱势（相对收益落后）行业。<b>例外：s6「抗跌」</b>为反向(市场弱势)信号，但买入标的取「相对抗跌(跌幅最小、相对强势)」行业，而非其他反向信号的「买超跌」。各信号按「类内等权 → 类间等权 → 20日指数衰减叠加」融合，得到每日行业融合得分，取前 5 名中信一级行业，再映射到代表性行业 ETF 构建多头组合。论文显示 <b>日频</b>效果最好（行业组合年化约 23%，ETF 组合年化约 22%，Sharpe≈0.97）。</p>

      <h3>二、六类信号与对应数据指标</h3>
      <ul>
        <li><b>低位修复与启动</b>（s1–s4，正向）：<br/>— s1 用当日开/高/低/收构造「开盘收益 / 盘中低点回落 / 收盘收复位置」三个日内指标的 60 日分布分位（20% / 25% / 70%）刻画「低开—下探—拉回」形态，前提为收盘价低于 20 日均线；<br/>— s2 取上涨广度 60 日分位 > 60% 且行业收益中位数 > 0；<br/>— s3 取沪深300/500/1000 当日同涨且广度分位 > 50%；<br/>— s4 取收盘价低于 20 日线、20 日收益 > 0 且 20 日波动率 60 日分位 < 50%。<br/>指标：指数相对均线位置、当日涨跌幅、上涨行业广度、20日收益、当日 OHLC。</li>
        <li><b>大盘防御后反向修复</b>（s5–s6，反向）：<br/>— s5 取小盘-大盘(20日) z 分数 < −1.0 且当日小盘相对大盘收益差 > 0 且沪深300收涨；<br/>— s6 取中证全指单日收益 60 日分位 < 10%。<br/>指标：小盘-大盘相对收益（20日与当日）、全指单日跌幅分位。</li>
        <li><b>小盘风格回流与切换</b>（s7–s8，正向）：<br/>— s7 取小盘-大盘(20日) z < −1.0 且当日小盘相对大盘收益差 > 0 且广度分位 > 50%；<br/>— s8 取小盘-大盘(20日) z > 1.0 且当日小盘相对大盘收益差 > 0 且广度分位 > 50%。<br/>指标：中证1000-沪深300 收益差（20日与当日）。</li>
        <li><b>成长启动与弱势释放</b>（s9–s10）：<br/>— s9 取成长-沪深300(20日) z < −1.0 且当日成长相对沪深300收益差 > 0；<br/>— s10 取成长-沪深300(20日) z < −1.5 且沪深300收涨。<br/>指标：创业板指-沪深300 收益差（20日与当日）。</li>
        <li><b>风险释放</b>（s11–s13，反向）：<br/>— s11 取全指单日收益分位 < 15% 且广度分位 < 25%；<br/>— s12 取沪深300/500/1000 当日同步下跌且全指单日收益分位 < 30%；<br/>— s13 取全指单日收益分位 < 10% 且量能分位 > 80%。<br/>指标：单日跌幅分位、上涨广度分位、多宽基当日同步下跌、量能放大倍数（额/20日均）。</li>
        <li><b>行业结构分化</b>（s14，正向）：取行业收益离散度或最强-最弱差 60 日分位 > 80%。指标：行业收益标准差、最强-最弱差。</li>
      </ul>

async function init(){
  try {
    if (window.__PUBLIC_DATA_URL__) {
      try {
        const res = await fetch(window.__PUBLIC_DATA_URL__, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const j = await res.json();
        LATEST = j.latest;
        HISTORY = j.history || [];
      } catch (e) {
        console.warn('[init] 公网实时数据拉取失败，回退内联数据：', e.message);
        if (window.__SEED__ && window.__SEED__.latest) {
          LATEST = window.__SEED__.latest;
          HISTORY = window.__SEED__.history || [];
        } else {
          LATEST = await getJSON('/api/data');
          HISTORY = await getJSON('/api/history') || [];
        }
      }
    } else if (window.__SEED__ && window.__SEED__.latest) {
      LATEST = window.__SEED__.latest;
      HISTORY = window.__SEED__.history || [];
    } else {
      LATEST = await getJSON('/api/data');
      HISTORY = await getJSON('/api/history') || [];
    }
    if (window.__STATIC__) {
      document.getElementById('refreshBtn')?.style.setProperty('display', 'none');
      document.getElementById('sandboxPanel')?.style.setProperty('display', 'none');
    }
    if (LATEST) { render(LATEST); if (!window.__STATIC__) initSandbox(LATEST.params); }
    else {
      const proto = location.protocol;
      let hint = '';
      if (proto === 'file:') {
        hint = '<br/><small style="color:var(--muted)">你似乎是通过 <b>file://</b> 直接打开 HTML 文件。请通过本地服务访问：在终端运行 <code style="background:var(--off);padding:2px 6px;border-radius:6px">node src/server.mjs</code>，然后打开 <b>http://localhost:8787</b></small>';
      } else {
        hint = '<br/><small style="color:var(--muted)">服务可能未启动或数据尚未生成。请确认终端中已运行 <b>node src/server.mjs</b>，然后刷新。</small>';
      }
      $('#app').innerHTML = '<div class="empty">尚未抓取到数据。' + hint + '<br/><button class="btn btn-primary" onclick="refresh()" style="margin-top:14px">立即刷新一次</button></div>';
    }
  } catch (e) {
    console.error('init 渲染异常', e);
    $('#app').innerHTML = '<div class="empty">页面初始化出错。<br/><small style="color:var(--muted)">' + esc(e.message) + '</small><br/><button class="btn btn-primary" onclick="location.reload()" style="margin-top:14px">重新加载</button></div>';
  }
}

function renderIntraday(d){

  const body = rows.map(r => {

  modalEl.classList.add('show');

}

function openDetail(type){
  const d = LATEST; if (!d || !d.industries) return;
  if (type === 'intraday'){ renderIntraday(d); return; }
  const meta = DETAIL_META[type] || { title:'行业明细', sub:'' };
  const inds = (d.industries || []).map(i => ({ name:i.name, ret:i.ret }));
  const valid = inds.filter(i => i.ret !== null && !isNaN(i.ret));
  const sorted = [...inds].sort((a,b)=> (b.ret==null?-1e9:b.ret) - (a.ret==null?-1e9:a.ret));
  const top5set = new Set((d.top5||[]).map(t=>t.name));
  const maxAbs = Math.max(0.1, ...valid.map(i=>Math.abs(i.ret)));
  const up = valid.filter(i=>i.ret>0).length, down = valid.filter(i=>i.ret<0).length;
  const vals = valid.map(i=>i.ret).sort((a,b)=>a-b);
  const med = vals.length ? (vals.length%2 ? vals[(vals.length-1)/2] : (vals[vals.length/2-1]+vals[vals.length/2])/2) : null;
  const mx = valid.length ? valid.reduce((p,i)=>i.ret>p.ret?i:p) : null;
  const mn = valid.length ? valid.reduce((p,i)=>i.ret<p.ret?i:p) : null;
  let summary = '';
  if (type==='breadth') summary = `<span class="dtl-chip">上涨 <b>${up}</b></span><span class="dtl-chip">下跌 <b>${down}</b></span><span class="dtl-chip">占比 <b>${(up/(valid.length||1)*100).toFixed(0)}%</b></span>`;
  else if (type==='median') summary = `<span class="dtl-chip">中位数 <b>${med==null?'—':fmtPct(med)}</b></span><span class="dtl-chip">样本 <b>${valid.length}</b> 行业</span>`;
  else if (type==='dispersion') summary = `<span class="dtl-chip">离散度 <b>${(d.breadth&&d.breadth.dispersion!=null?d.breadth.dispersion.toFixed(2)+'%':'—')}</b></span><span class="dtl-chip">样本 <b>${valid.length}</b></span>`;
  else if (type==='spread') summary = `<span class="dtl-chip">最强 <b>${mx?mx.name+' '+fmtPct(mx.ret):'—'}</b></span><span class="dtl-chip">最弱 <b>${mn?mn.name+' '+fmtPct(mn.ret):'—'}</b></span><span class="dtl-chip">差 <b>${mx&&mn?(mx.ret-mn.ret).toFixed(2)+'%':'—'}</b></span>`;
  const rowArr = sorted.map((i,idx)=>{
    const has = i.ret!==null && !isNaN(i.ret);
    const cls = has ? (i.ret>=0?'pos':'neg') : '';
    const w = has ? (Math.abs(i.ret)/maxAbs*100).toFixed(1) : 0;
    const col = has ? (i.ret>=0?'var(--up)':'var(--down)') : 'transparent';
    const is5 = top5set.has(i.name);
    return `<div class="dtl-row">
      <div class="rk">${idx+1}</div>
      <div class="nm">${esc(i.name)}${is5?'<span class="tag5">TOP5</span>':''}</div>
      <div class="rt ${cls}">${has?fmtPct(i.ret):'—'}</div>
      <div class="dtl-bar"><i style="width:${w}%;background:${col}"></i></div>
    </div>`;
  });
  if (type==='median' && med!=null){ const mi = sorted.filter(i=> i.ret!==null && !isNaN(i.ret) && i.ret>med).length; if (mi>=0 && mi<rowArr.length) rowArr.splice(mi,0,`<div class="dtl-median"><span>← 中位数 ${fmtPct(med)}</span></div>`); }
  $('#dtlTitle').textContent = meta.title;
  $('#dtlSub').textContent = meta.sub;
  $('#dtlBody').innerHTML = `<div class="dtl-summary">${summary}</div><div class="dtl-list">${rowArr.join('')}</div>`;
  modalEl.classList.add('show');
  document.body.style.overflow='hidden';
}
function closeDetail(){ modalEl.classList.remove('show'); document.body.style.overflow=''; }

  { key:'panicDownPct',     name:'s11 恐慌分位',          fmt:'pct', min:0.01, max:0.5, step:0.01, desc:'中证全指单日收益的历史分位 < 此值 ＝ 恐慌下跌' },
  { key:'volHighPct',       name:'s13/s14 放量·分化阈值', fmt:'pct', min:0.5,  max:1,   step:0.01, desc:'量能 / 离散度的历史分位 > 此值 ＝ 放量 / 结构性分化' },
  { key:'lowOpenPct',       name:'s1 低开分位',           fmt:'pct', min:0.01, max:0.5, step:0.01, desc:'开盘收益的历史分位 < 此值 ＝ 显著低开' },
  { key:'dipPct',           name:'s1 下探分位',           fmt:'pct', min:0.01, max:0.5, step:0.01, desc:'盘中低点较开盘回落的历史分位 < 此值 ＝ 明显下探' },
  { key:'recoveryPct',      name:'s1 拉回分位',           fmt:'pct', min:0.3,  max:1,   step:0.01, desc:'收盘在当日振幅位置的历史分位 > 此值 ＝ 明显收复' },
  { key:'volConvergePct',   name:'s4 波动率收敛分位',     fmt:'pct', min:0.1,  max:0.9, step:0.01, desc:'20日波动率的历史分位 < 此值 ＝ 振幅较前期收敛' },
  { key:'resonanceDownPct', name:'s12 跌幅较高分位',      fmt:'pct', min:0.01, max:0.5, step:0.01, desc:'中证全指单日收益的历史分位 < 此值 ＝ 跌幅较高' },
  { key:'zStyle',           name:'s5/s7/s8/s9 风格z阈值', fmt:'num', min:0.5,  max:3,   step:0.1,  desc:'风格相对强弱 z 分数绝对值 > 此值 ＝ 显著偏离' },
  { key:'zStyleExtreme',    name:'s10 退潮z阈值',         fmt:'num', min:1,    max:3,   step:0.1,  desc:'成长-沪深300 的 z < -此值 ＝ 显著退潮' },
];
function fmtParam(pm, v){ return pm.fmt === 'pct' ? Math.round(v * 100) + '%' : v.toFixed(1); }

let SB_PARAMS = {};
function initSandbox(defaultParams){
  if (!defaultParams) return;
  SB_PARAMS = { ...defaultParams };
  const body = $('#sbBody');
  if (!body) return;
  body.innerHTML = PARAM_META.map(pm => `
    <div class="sb-row">
      <div class="sb-label">
        <div class="sb-name">${esc(pm.name)}</div>
        <div class="sb-desc">${esc(pm.desc)}</div>
      </div>
      <div class="sb-ctrl">
        <input type="range" min="${pm.min}" max="${pm.max}" step="${pm.step}" value="${SB_PARAMS[pm.key]}" data-k="${pm.key}" class="sb-range" aria-label="${esc(pm.name)}"/>
        <div class="sb-val" id="sbv-${pm.key}">${fmtParam(pm, SB_PARAMS[pm.key])}</div>
      </div>
    </div>`).join('');
  body.querySelectorAll('.sb-range').forEach(r => r.addEventListener('input', onSbInput));
  setSbFoot('拖动滑块即按新切点重算信号激活状态（秒级，无需重新取数）。沙盘结果不写入数据，刷新页面或点「重置默认」恢复官方阈值。');
}
let _sbTimer = null;
function onSbInput(e){
  const k = e.target.dataset.k;
  const pm = PARAM_META.find(m => m.key === k);
  const v = +e.target.value;
  SB_PARAMS[k] = v;
  const lbl = $('#sbv-' + k); if (lbl) lbl.textContent = fmtParam(pm, v);
  clearTimeout(_sbTimer);
  _sbTimer = setTimeout(runEvaluate, 220);
}
let _sbBusy = false;
async function runEvaluate(){
  if (_sbBusy || !LATEST) return;
  _sbBusy = true;
  setSbFoot('按新切点重算中…');
  try {
    const r = await fetch('/api/evaluate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ params: SB_PARAMS }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const res = await r.json();
    render({ ...LATEST, ...res, sandbox: true });
    setSbFoot(`沙盘推演中：当前 ${res.activeCount}/14 信号激活 · ${res.activeCats}/6 大类 · 状态「${res.regime}」。结果未写入数据，刷新即恢复。`);
  } catch (e) {
    setSbFoot('重算失败：' + e.message);
  } finally { _sbBusy = false; }
}
function setSbFoot(t){ const f = $('#sbFoot'); if (f) f.textContent = t; }
function resetSandbox(){
  if (!LATEST) return;
  SB_PARAMS = { ...LATEST.params };
  PARAM_META.forEach(pm => {
    const sb = $('#sbBody'); if (!sb) return;
    const r = sb.querySelector(`[data-k="${pm.key}"]`);
    if (r){ r.value = SB_PARAMS[pm.key]; const lbl = $('#sbv-' + pm.key); if (lbl) lbl.textContent = fmtParam(pm, SB_PARAMS[pm.key]); }
  });
  runEvaluate();
}
$('#sbReset').addEventListener('click', resetSandbox);
$('#sbHead').addEventListener('click', e => { if (e.target.closest('#sbReset')) return; const p = $('#sandboxPanel'); if (p) p.classList.toggle('collapsed'); });

init();
</script>
</body>
